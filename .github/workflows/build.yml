@Composable
fun TopBar(context: Context, fileCount: Int) {
    val bm = context.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
    val battery = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
    val storagePath = FileManager.getMirrorRoot(context)
    val freeSpace = storagePath.freeSpace / (1024*1024)

    Row(
        modifier = Modifier.fillMaxWidth().background(Color(0xFF1F1F1F)).padding(12.dp),
        verticalAlignment = Alignment.CenterVertically,
        horizontalArrangement = Arrangement.SpaceBetween
