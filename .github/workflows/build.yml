package com.colonialempire.mobile

object CompatibilityChecker {

    data class CheckResult(val ok: Boolean, val warnings: List<String>)

    fun checkFile(relativePath: String, content: String): CheckResult {
        val warnings = mutableListOf<String>()
        val lower = content.lowercase()

        when {
            relativePath.contains("Veze.cpp", ignoreCase = true) -> {
                if (!content.contains("HP500") || !content.contains("HP1000") || !content.contains("HP1500")) 
                    warnings.add("Veze.cpp MISSING HP500/1000/1500")
                if (!content.contains("50m") || !content.contains("80m") || !content.contains("100m"))
                    warnings.add("Veze.cpp MISSING sfera 50/80/100m")
                if (!content.contains("osadka") && !lower.contains("osádka") && !content.contains("crew") && !content.contains("osadka 1"))
                    warnings.add("Veze.cpp MISSING osadka 1/2/3")
                if (!content.contains("Stronghold") && !content.contains("+20%"))
                    warnings.add("Veze.cpp MISSING Stronghold +20% obrana +20% dostrel")
            }
            relativePath.contains("Hradby.cpp", ignoreCase = true) -> {
                if (!content.contains("100") || !content.contains("HP1000"))
                    warnings.add("Hradby.cpp CHECK tluste 100+50/m 6m HP1000")
                if (!content.contains("200") || !content.contains("HP2000"))
                    warnings.add("Hradby.cpp CHECK 200+100/m 8m HP2000")
            }
            relativePath.contains("Pevnosti.cpp", ignoreCase = true) -> {
                if (!content.contains("6x6") || !content.contains("HP2000")) warnings.add("Pevnosti 6x6 HP2000 missing")
            }
            relativePath.contains("Tabor.cpp", ignoreCase = true) -> {
                if (!content.contains("cihly20") && !content.contains("20") ) warnings.add("Tabor cihly20+prkna20+platno10")
                if (!content.contains("500")) warnings.add("Tabor kapacita 500")
                if (!content.contains("NENI NUTNY") && !content.contains("neni nutny") && !content.lowercase().contains("not required")) {
                    // not fatal but warn
                }
            }
            relativePath.contains("ZasobovaciVuz.cpp", ignoreCase = true) -> {
                if (!content.contains("2x3") || !content.contains("500")) warnings.add("ZasobovaciVuz 2x3 500+kun VZDY missing")
            }
            relativePath.contains("Recyklace.cpp", ignoreCase = true) -> {
                if (!content.contains("50-75%") && !content.contains("50") ) warnings.add("Recyklace 50-75% missing")
            }
            relativePath.contains("World.cpp", ignoreCase = true) -> {
                if (!content.contains("Perlin") || !content.contains("jiliste") && !lower.contains("jíl") && !content.contains("clay")) {
                    warnings.add("World.cpp Perlin jiliste VZDY u rek 50m 100% missing")
                }
                if (!content.contains("50m")) warnings.add("World.cpp 50m spawn missing")
            }
            relativePath.contains("Army.cpp", ignoreCase = true) -> {
                if (!content.contains("18") || !content.contains("Domobrana") ) warnings.add("Army.cpp 18 typu Domobrana")
                if (!content.contains("HP50") || !content.contains("wallet")) warnings.add("Army.cpp HP50 wallet10")
            }
        }

        // Universal CRLF / header check - not warning, just info
        if (!content.startsWith("// GENERATED_FOR_PC_VERSION")) {
            // auto add header in FileManager, not fail
        }

        return CheckResult(warnings.isEmpty(), warnings)
    }
}

