package com.colonialempire.mobile

import android.content.Context
import android.os.Environment
import java.io.File
import java.text.SimpleDateFormat
import java.util.*

object FileManager {

    private const val ROOT_FOLDER = "ColonialEmpire"
    private const val MIRROR_FOLDER = "E_Hra_Mirror"

    fun getMirrorRoot(context: Context): File {
        val docs = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOCUMENTS)
        val root = File(docs, "$ROOT_FOLDER/$MIRROR_FOLDER")
        if (!root.exists()) root.mkdirs()
        return root
    }

    fun ensureStructure(context: Context): File {
        val root = getMirrorRoot(context)
        listOf(
            "Source/Buildings",
            "Source/World",
            "Source/Army",
            "Assets/Models",
            "Config"
        ).forEach {
            File(root, it).mkdirs()
        }
        return root
    }

    fun saveForPCVersion(context: Context, relativePath: String, contentRaw: String): Pair<File, CompatibilityChecker.CheckResult> {
        ensureStructure(context)
        val root = getMirrorRoot(context)
        val target = File(root, relativePath)

        // Ensure parent
        target.parentFile?.mkdirs()

        // Compatibility check before saving
        val check = CompatibilityChecker.checkFile(relativePath, contentRaw)

        // Build final content with header + CRLF + UTF-8 without BOM
        val header = "// GENERATED_FOR_PC_VERSION E:\\Hra\\${
            relativePath.replace('/', '\\')
        } - COMPATIBLE WITH Windows Studio v1.0 - HP500/1000/1500 sfera 50/80/100m osadka 1/2/3 Stronghold +20% obrana +20% dostrel SCHVALENO\r\n"
        
        var finalContent = contentRaw
        if (!finalContent.startsWith("// GENERATED_FOR_PC_VERSION")) {
            finalContent = header + finalContent
        }

        // Convert LF to CRLF, ensure UTF-8 without BOM
        val crlfContent = finalContent.replace("\r\n", "\n").replace("\n", "\r\n")

        target.writeText(crlfContent, charset = Charsets.UTF_8)

        // Also mirror to internal app files for safety
        val internalMirror = File(context.filesDir, "mirror/$relativePath")
        internalMirror.parentFile?.mkdirs()
        internalMirror.writeText(crlfContent, charset = Charsets.UTF_8)

        return Pair(target, check)
    }

    fun listFiles(context: Context): List<File> {
        val root = getMirrorRoot(context)
        if (!root.exists()) return emptyList()
        return root.walkTopDown().filter { it.isFile }.toList()
    }

    fun getFileTreeJson(context: Context): String {
        val files = listFiles(context)
        val relative = files.map { it.relativeTo(getMirrorRoot(context)).path.replace('\\','/') }
        return relative.joinToString(",", "[", "]") { "\"$it\"" }
    }

    fun nowStamp(): String {
        return SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
    }
}

