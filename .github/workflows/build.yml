        Column {
            Text("ColonialEmpire Mobile", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 16.sp)
            Text("BEZ CLOUDU • LOKÁLNĚ • ${storagePath.absolutePath}", color = Color(0xFF9E9E9E), fontSize = 9.sp, fontFamily = FontFamily.Monospace)
        }
        Column(horizontalAlignment = Alignment.End) {
            Text("🔋 $battery% | 📦 ${freeSpace}MB volno | 📁 $fileCount souborů", color = Color(0xFF4CAF50), fontSize = 10.sp)
            Text("GOLD_BUILD_1_0 • SCHVÁLENO", color = Color(0xFFFFC107), fontSize = 9.sp, fontWeight = FontWeight.Bold)
        }
    }
}

@SuppressLint("SetJavaScriptEnabled")
@Composable
fun ChatWebView(tab: TabId, host: AndroidHost, prompt: String) {
    val context = LocalContext.current
    Column {
        // Info bar
        Row(modifier = Modifier.fillMaxWidth().background(Color(0xFF2D2D2D)).padding(6.dp), horizontalArrangement = Arrangement.SpaceBetween) {
            Text("${tab.label} - ${if(tab==TabId.CHAT1) "LEHKY - jen texty" else "TEZKY - generuje"}", color = Color.White, fontSize = 10.sp, fontWeight = FontWeight.Bold)
            Text("androidHost: OpenChat, SendPromptToChat, SaveFileForPCVersion...", color = Color(0xFF9E9E9E), fontSize = 8.sp)
        }
        AndroidView(factory = {
            WebView(context).apply {
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                webChromeClient = WebChromeClient()
                webViewClient = WebViewClient()
                addJavascriptInterface(host, "androidHost")
                loadUrl(tab.url ?: "https://www.meta.ai/")
            }
        }, modifier = Modifier.fillMaxSize())
    }
}

@Composable
fun FilesTab(fileList: List<File>, onRefresh: () -> Unit, onLog: (String) -> Unit) {
    val context = LocalContext.current
    var selectedFile by remember { mutableStateOf<File?>(null) }
    var editorContent by remember { mutableStateOf("") }

    Column(modifier = Modifier.fillMaxSize().padding(8.dp)) {
        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
            Button(onClick = { onRefresh() }) { Text("Obnovit", fontSize = 12.sp) }
            Button(onClick = {
                val root = FileManager.getMirrorRoot(context)
                onLog("[${FileManager.nowStamp()}] ANDROID PrepareForTransferToPC ${root.absolutePath}")
                onLog("[${FileManager.nowStamp()}] ANDROID PRIPRAVENO K PRETAZENI DO PC ${fileList.size} souboru")
            }) { Text("Pripraveno k pretazeni", fontSize = 12.sp) }
        }

        Spacer(Modifier.height(8.dp))

        if (selectedFile == null) {
            Text("Documents/ColonialEmpire/E_Hra_Mirror/ - strom - zelené nový žluté upgradovaný", color = Color.White, fontSize = 11.sp)
            LazyColumn(modifier = Modifier.fillMaxSize()) {
                items(fileList.sortedBy { it.name }) { file ->
                    val isNew = System.currentTimeMillis() - file.lastModified() < 1000*60*60
                    val bg = if (isNew) Color(0xFF1B5E20) else Color(0xFF212121)
                    Row(modifier = Modifier.fillMaxWidth().padding(vertical=2.dp).background(bg).clickable {
                        selectedFile = file
                        editorContent = try { file.readText() } catch(e: Exception) { "Nelze cist: ${e.message}" }
                    }.padding(8.dp), horizontalArrangement = Arrangement.SpaceBetween) {
                        Text(file.relativeTo(FileManager.getMirrorRoot(context)).path, color = Color.White, fontSize = 11.sp, fontFamily = FontFamily.Monospace)
                        Text("${file.length()}B", color = Color(0xFF9E9E9E), fontSize = 10.sp)
                    }
                }
            }
        } else {
            // Editor
            Text("Editor: ${selectedFile?.name}", color = Color.White, fontWeight = FontWeight.Bold)
            TextField(
                value = editorContent,
                onValueChange = { editorContent = it },
                modifier = Modifier.fillMaxWidth().weight(1f).verticalScroll(rememberScrollState()),
                textStyle = androidx.compose.ui.text.TextStyle(fontFamily = FontFamily.Monospace, fontSize = 11.sp)
            )
            Row(horizontalArrangement = Arrangement.spacedBy(8.dp), modifier = Modifier.padding(top=8.dp)) {
                Button(onClick = {
                    selectedFile?.let { f ->
                        val rel = f.relativeTo(FileManager.getMirrorRoot(context)).path.replace('\\','/')
                        val (saved, check) = FileManager.saveForPCVersion(context, rel, editorContent)
                        onLog("[${FileManager.nowStamp()}] ANDROID ${f.name} HP500/1000/1500 ulozeno pro PC verzi E_Hra_Mirror/$rel OK")
                        if (!check.ok) onLog("[${FileManager.nowStamp()}] ANDROID WARNING ${check.warnings.joinToString()}")
                        onRefresh()
                    }
                }) { Text("Ulozit pro PC verzi", fontSize = 11.sp) }
                Button(onClick = {
                    selectedFile?.let { f ->
                        onLog("[${FileManager.nowStamp()}] PRIPRAVENO K PRETAZENI DO PC ${f.name}")
                    }
                }) { Text("Pripraveno k pretazeni (kabelem)", fontSize = 11.sp) }
                Button(onClick = {
                    selectedFile?.let { f ->
                        val rel = f.relativeTo(FileManager.getMirrorRoot(context)).path.replace('\\','/')
                        val host = AndroidHost(context, onLog, onRefresh)
                        host.SendToChatForPC(rel)
                    }
                }) { Text("Poslat do chatu pro PC appku", fontSize = 11.sp) }
                OutlinedButton(onClick = { selectedFile = null }) { Text("Zavrit") }
            }
        }
    }
}

