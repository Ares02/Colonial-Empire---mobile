package com.colonialempire.mobile

import android.content.Context
import android.content.Intent
import android.webkit.JavascriptInterface
import android.widget.Toast
import androidx.core.content.FileProvider
import kotlinx.coroutines.CoroutineScope
import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.launch
import java.io.File

class AndroidHost(
    private val context: Context,
    private val onLog: (String) -> Unit,
    private val onFileChanged: () -> Unit
) {
    private val scope = CoroutineScope(Dispatchers.Main)

    @JavascriptInterface
    fun OpenChat(chatName: String): String {
        scope.launch {
            onLog("[${FileManager.nowStamp()}] ANDROID OpenChat $chatName OK")
        }
        return "Opened $chatName"
    }

    @JavascriptInterface
    fun SendPromptToChat(chatName: String, prompt: String): String {
        scope.launch {
            onLog("[${FileManager.nowStamp()}] ANDROID SendPromptToChat $chatName -> ${prompt.take(80)}")
            Toast.makeText(context, "Prompt poslán do $chatName", Toast.LENGTH_SHORT).show()
        }
        // In WebView implementation, JS can handle navigation
        return "Prompt queued for $chatName"
    }

    @JavascriptInterface
    fun CloseChat(): String {
        onLog("[${FileManager.nowStamp()}] ANDROID CloseChat OK")
        return "Closed"
    }

    @JavascriptInterface
    fun GetLog(): String {
        return "Log requested"
    }

    @JavascriptInterface
    fun GetFileTree(): String {
        return FileManager.getFileTreeJson(context)
    }

    @JavascriptInterface
    fun GenerateFile(fileName: String, content: String): String {
        try {
            val (file, check) = FileManager.saveForPCVersion(context, fileName, content)
            scope.launch {
                onFileChanged()
                if (check.ok) {
                    onLog("[${FileManager.nowStamp()}] ANDROID ${File(fileName).name} HP500/1000/1500 ulozeno pro PC verzi E_Hra_Mirror/$fileName OK")
                } else {
                    onLog("[${FileManager.nowStamp()}] ANDROID WARNING ${File(fileName).name} ${check.warnings.joinToString("; ")}")
                }
            }
            return file.absolutePath
        } catch (e: Exception) {
            onLog("[${FileManager.nowStamp()}] ANDROID ERROR GenerateFile ${e.message}")
            return "ERROR ${e.message}"
        }
    }

    @JavascriptInterface
    fun SaveFileForPCVersion(relativePath: String, content: String): String {
        return GenerateFile(relativePath, content)
    }

    @JavascriptInterface
    fun ListFilesForPC(): String {
        return FileManager.getFileTreeJson(context)
    }

    @JavascriptInterface
    fun PrepareForTransferToPC(): String {
        val files = FileManager.listFiles(context)
        scope.launch {
            onLog("[${FileManager.nowStamp()}] PRIPRAVENO K PRETAZENI DO PC ${files.size} souboru v Documents/ColonialEmpire/E_Hra_Mirror/")
            files.take(10).forEach {
                onLog("[${FileManager.nowStamp()}] PRIPRAVENO K PRETAZENI DO PC ${it.name}")
            }
        }
        return "Prepared ${files.size} files"
    }

    @JavascriptInterface
    fun SendToChatForPC(fileName: String): String {
        try {
            val root = FileManager.getMirrorRoot(context)
            val file = File(root, fileName)
            if (!file.exists()) {
                onLog("[${FileManager.nowStamp()}] ERROR Soubor nenalezen $fileName")
                return "NOT_FOUND"
            }
            // Share via intent - user can upload to Meta AI chat
            val intent = Intent(Intent.ACTION_SEND).apply {
                type = "text/plain"
                putExtra(Intent.EXTRA_SUBJECT, file.name)
                putExtra(Intent.EXTRA_TEXT, file.readText())
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            }
            context.startActivity(Intent.createChooser(intent, "Poslat do chatu pro PC appku: ${file.name}").apply {
                addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
            })
            onLog("[${FileManager.nowStamp()}] POSLANO DO CHATU PRO PC ${file.name}")
            return "SENT"
        } catch (e: Exception) {
            onLog("[${FileManager.nowStamp()}] ERROR SendToChatForPC ${e.message}")
            return "ERROR ${e.message}"
        }
    }

    @JavascriptInterface
    fun getStorageInfo(): String {
        val root = FileManager.getMirrorRoot(context)
        val files = FileManager.listFiles(context)
        return "Cesta: ${root.absolutePath} | Souboru: ${files.size}"
    }
}

