          ls -lh /tmp/project.zip
          echo "Rozbaluji..."
          unzip -o /tmp/project.zip -d .
          echo "Soubory:"
          ls -lh
          find app -type f | head -30
          chmod +x gradlew
          echo "Projekt pripraven BEZ CLOUDU"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug --stacktrace

      - name: Najdi APK
        run: |
          find app/build/outputs -name "*.apk" -type f
          APK=$(find app/build/outputs -name "*.apk" | head -1)
          cp "$APK" ColonialEmpire_Studio_Mobile.apk
          ls -lh ColonialEmpire_Studio_Mobile.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ColonialEmpire_Studio_Mobile-APK-BEZ-CLOUDU-GOLD
          path: ColonialEmpire_Studio_Mobile.apk
          retention-days: 90
